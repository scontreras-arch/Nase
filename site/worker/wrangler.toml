# Reconstruido a partir del Worker desplegado `curly-feather-8a3c` (no estaba
# respaldado en el repo). Verificar antes del primer deploy desde aquí.
#
# El token de administrador se carga como secret, nunca en este archivo:
#   wrangler secret put ADMIN_TOKEN
#
# ACCESO_ABIERTO debe permanecer en "0": con "1", POST /api/login entrega el
# token de administrador sin pedir clave y deja el panel abierto a cualquiera.
# El README del repo decía "1" por estar desactualizado; producción ya estaba
# en "0" desde el 17-08, y un deploy con este archivo lo revirtió por error.

name = "curly-feather-8a3c"
main = "src/index.js"
compatibility_date = "2026-07-24"

[assets]
directory = "../web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "nase-inventario"
database_id = "e837ecfb-2a63-4341-9011-8f5e0a826ec3"

[vars]
ACCESO_ABIERTO = "0"
