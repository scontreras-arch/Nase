<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NASE Agrotech · CRM demo standalone (datos de ejemplo, sin login)">
<meta name="robots" content="noindex,nofollow">
<title>NASE Agrotech · CRM — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NASE Agrotech CRM · Agro Dark Theme
   ============================================================ */

:root {
    --bg: #09090b;
    --bg-elevated: #18181b;
    --bg-card: #131316;
    --border: #27272a;
    --border-hover: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --text-dim: #71717a;
    --cyan: #6ba31f;
    --cyan-hover: #8bc34a;
    --cyan-bg: rgba(107, 163, 31, 0.08);
    --cyan-border: rgba(107, 163, 31, 0.3);
    --emerald: #10b981;
    --emerald-bg: rgba(16, 185, 129, 0.08);
    --amber: #f59e0b;
    --amber-bg: rgba(245, 158, 11, 0.08);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.08);
    --red-border: rgba(239, 68, 68, 0.3);
    
    --font-display: 'JetBrains Mono', 'Courier New', monospace;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; }

/* ===== LOGIN ===== */
.login-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background: radial-gradient(ellipse at top, rgba(107, 163, 31, 0.06), transparent 70%), var(--bg);
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2.5rem;
}

.brand { text-align: center; margin-bottom: 2rem; }
.brand-eyebrow {
    font-family: var(--font-display);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
}
.brand-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
.brand-tagline { font-size: 0.875rem; color: var(--text-muted); }

.login-form { display: flex; flex-direction: column; gap: 1rem; }

.field { display: flex; flex-direction: column; gap: 0.375rem; }
.field label {
    font-family: var(--font-display);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.375rem;
}
.field input, .field select, .field textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.625rem 0.875rem;
    font-size: 0.875rem;
    color: var(--text);
    width: 100%;
    transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--cyan);
}

.priority-dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block;
}
.priority-CRIT { background: var(--red); }
.priority-IMP { background: var(--amber); }
.priority-OPT { background: var(--emerald); }
.priority-STD { background: var(--cyan); }

.btn-primary {
    background: var(--cyan);
    color: var(--bg);
    padding: 0.625rem 1.25rem;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.875rem;
    transition: background 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    justify-content: center;
}
.btn-primary:hover { background: var(--cyan-hover); }
.btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

.btn-secondary {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.5rem 0.875rem;
    border-radius: 4px;
    font-size: 0.75rem;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    white-space: nowrap;
}
.btn-secondary:hover { background: var(--bg-elevated); color: var(--text); }
.btn-secondary.cyan {
    background: var(--cyan-bg);
    border-color: var(--cyan-border);
    color: var(--cyan-hover);
}
.btn-secondary.cyan:hover { background: rgba(107, 163, 31, 0.15); }

.btn-ghost {
    color: var(--text-muted);
    padding: 0.5rem 0.75rem;
    font-size: 0.75rem;
    border-radius: 4px;
    transition: all 0.15s;
    white-space: nowrap;
}
.btn-ghost:hover { color: var(--text); background: var(--bg-elevated); }

.btn-link {
    color: var(--cyan-hover);
    font-size: 0.8125rem;
    text-decoration: none;
    background: none;
    padding: 0.25rem 0;
}
.btn-link:hover { text-decoration: underline; }

.login-actions {
    display: flex;
    justify-content: space-between;
    margin-top: -0.25rem;
    font-size: 0.8125rem;
}

.alert {
    padding: 0.75rem 1rem;
    border-radius: 4px;
    font-size: 0.8125rem;
    border: 1px solid;
}
.alert-error {
    background: var(--red-bg);
    border-color: var(--red-border);
    color: #fca5a5;
}
.alert-success {
    background: var(--emerald-bg);
    border-color: rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
}

.login-footer {
    margin-top: 2rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-family: var(--font-display);
}

/* ===== HEADER ===== */
.app-header {
    background: rgba(9, 9, 11, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 40;
}
.header-content {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
}
.header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.brand-mini { padding-right: 1rem; }
.brand-mini-eyebrow {
    font-family: var(--font-display);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--text-dim);
}
.brand-mini-title {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
}

.nav-tabs { display: flex; gap: 0.25rem; }
.nav-tab {
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.15s;
    white-space: nowrap;
}
.nav-tab:hover { background: var(--bg-elevated); color: var(--text); }
.nav-tab.active {
    background: var(--cyan-bg);
    color: var(--cyan-hover);
}
.badge {
    background: var(--red-bg);
    color: #fca5a5;
    border: 1px solid var(--red-border);
    border-radius: 999px;
    padding: 0.0625rem 0.375rem;
    font-size: 10px;
    font-family: var(--font-display);
}

.user-info {
    font-size: 0.75rem;
    color: var(--text-muted);
    padding: 0 0.5rem;
    font-family: var(--font-display);
}

@media (max-width: 768px) {
    .nav-tab span { display: none; }
    .btn-secondary span, .btn-primary span { display: none; }
    .user-info { display: none; }
}

/* ===== CONTAINERS ===== */
.container { max-width: 1600px; margin: 0 auto; padding: 1rem; }
.container-wide { max-width: 1800px; }
.container-narrow { max-width: 800px; }

.view-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem; letter-spacing: -0.02em; }
.view-subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }

/* ===== KPIs ===== */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
    margin-bottom: 1rem;
}
@media (min-width: 1024px) {
    .kpi-grid { grid-template-columns: repeat(4, 1fr); gap: 1rem; }
}

.kpi-card {
    border: 1px solid;
    border-radius: 6px;
    padding: 1rem;
}
.kpi-cyan { border-color: var(--cyan-border); background: var(--cyan-bg); }
.kpi-emerald { border-color: rgba(16, 185, 129, 0.3); background: var(--emerald-bg); }
.kpi-amber { border-color: rgba(245, 158, 11, 0.3); background: var(--amber-bg); }
.kpi-red { border-color: var(--red-border); background: var(--red-bg); }

.kpi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
}
.kpi-label {
    font-family: var(--font-display);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
}
.kpi-value {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.25rem;
}
.kpi-sublabel {
    font-size: 0.75rem;
    color: var(--text-dim);
}

/* ===== FILTERS ===== */
.filters-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    background: rgba(24, 24, 27, 0.5);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    margin-bottom: 1rem;
}
.search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 400px;
}
.search-wrap svg {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
}
.search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.75rem 0.5rem 2.25rem;
    font-size: 0.875rem;
    color: var(--text);
}
.search-wrap input:focus { outline: none; border-color: var(--cyan); }

.filters-bar select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    color: var(--text);
}
.leads-count {
    font-family: var(--font-display);
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-left: auto;
}

/* ===== TABLA ===== */
.table-wrap {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg-card);
}
.table-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: rgba(24, 24, 27, 0.5);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.table-header h3 { font-size: 0.875rem; font-weight: 700; }
.table-subtitle {
    font-family: var(--font-display);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-left: auto;
}

.table-scroll { overflow-x: auto; }
.table-scroll table { width: 100%; min-width: 900px; font-size: 0.875rem; border-collapse: collapse; }
.table-scroll thead {
    border-bottom: 1px solid var(--border);
    background: rgba(24, 24, 27, 0.3);
}
.table-scroll th {
    padding: 0.5rem 0.75rem;
    text-align: left;
    font-family: var(--font-display);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    font-weight: 500;
}
.table-scroll th.right { text-align: right; }
.table-scroll td {
    padding: 0.75rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
}
.table-scroll tr.lead-row { transition: background 0.15s; }
.table-scroll tr.lead-row:hover { background: var(--cyan-bg); }
.lead-id-cell { font-family: var(--font-display); font-size: 0.75rem; color: var(--text-dim); }
.empresa-name { font-weight: 500; color: var(--text); margin-bottom: 0.25rem; }
.empresa-contact { font-size: 0.75rem; color: var(--text-dim); }

.usd-main {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--text);
}
.usd-sub {
    font-family: var(--font-display);
    font-size: 0.75rem;
    color: var(--cyan-hover);
}

.estado-pill {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid;
}
.estado-Lead { background: rgba(100, 116, 139, 0.15); color: #cbd5e1; border-color: rgba(100, 116, 139, 0.3); }
.estado-Calificado { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border-color: rgba(59, 130, 246, 0.3); }
.estado-Cotizado { background: var(--amber-bg); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }
.estado-Negociando { background: rgba(249, 115, 22, 0.15); color: #fdba74; border-color: rgba(249, 115, 22, 0.3); }
.estado-Ganado { background: var(--emerald-bg); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.3); }
.estado-Perdido { background: var(--red-bg); color: #fca5a5; border-color: var(--red-border); }
.estado-Pausado { background: rgba(82, 82, 91, 0.15); color: #a1a1aa; border-color: rgba(82, 82, 91, 0.3); }

.action-btns {
    display: flex;
    gap: 0.25rem;
    align-items: center;
}
@media (min-width: 768px) {
    .action-btns { opacity: 0; transition: opacity 0.15s; }
    .lead-row:hover .action-btns { opacity: 1; }
}
.icon-btn {
    padding: 0.375rem;
    border-radius: 4px;
    transition: background 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--cyan-hover);
}
.icon-btn:hover { background: var(--cyan-bg); }
.icon-btn.danger { color: #fca5a5; }
.icon-btn.danger:hover { background: var(--red-bg); }
.icon-btn.ai { color: #c4b5fd; }
.icon-btn.ai:hover { background: rgba(139, 92, 246, 0.16); }

.priority-star { color: var(--cyan); margin-right: 0.25rem; }

.fecha-overdue { color: #fca5a5 !important; font-weight: 600; }
.fecha-today { color: #fcd34d !important; font-weight: 600; }

.proxima-accion {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 0.125rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 200px;
}

/* Cotización progress mini */
.cotizacion-progress {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.25rem;
    font-size: 11px;
}
.progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    max-width: 80px;
}
.progress-fill {
    height: 100%;
    background: var(--cyan);
    transition: width 0.3s;
}

/* ===== KANBAN ===== */
.kanban-board {
    display: flex;
    gap: 0.75rem;
    overflow-x: auto;
    padding-bottom: 1rem;
}
.kanban-col {
    flex-shrink: 0;
    width: 280px;
}
.kanban-col-header {
    padding: 0.625rem 0.75rem;
    background: rgba(24, 24, 27, 0.5);
    border: 1px solid var(--border);
    border-radius: 4px 4px 0 0;
    border-top: 2px solid;
}
.kanban-col-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.75rem;
    font-weight: 700;
}
.kanban-col-count {
    font-family: var(--font-display);
    font-size: 10px;
    background: var(--bg-elevated);
    padding: 0.0625rem 0.5rem;
    border-radius: 999px;
    color: var(--text-dim);
}
.kanban-col-usd {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 0.25rem;
}
.kanban-col-body {
    background: rgba(24, 24, 27, 0.3);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 4px 4px;
    padding: 0.5rem;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}
.kanban-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.75rem;
    cursor: pointer;
    transition: border-color 0.15s;
}
.kanban-card:hover { border-color: var(--cyan-border); }
.kanban-card-id {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 0.25rem;
}
.kanban-card-title {
    font-weight: 500;
    font-size: 0.875rem;
    margin-bottom: 0.25rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.kanban-card-meta {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.kanban-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    font-family: var(--font-display);
}

/* Kanban con colores por columna */
.kanban-col[data-estado="Lead"] .kanban-col-header { border-top-color: #64748b; }
.kanban-col[data-estado="Calificado"] .kanban-col-header { border-top-color: #3b82f6; }
.kanban-col[data-estado="Cotizado"] .kanban-col-header { border-top-color: #f59e0b; }
.kanban-col[data-estado="Negociando"] .kanban-col-header { border-top-color: #f97316; }
.kanban-col[data-estado="Ganado"] .kanban-col-header { border-top-color: #10b981; }
.kanban-col[data-estado="Perdido"] .kanban-col-header { border-top-color: #ef4444; }
.kanban-col[data-estado="Pausado"] .kanban-col-header { border-top-color: #52525b; }

/* ===== HOY ===== */
.hoy-card {
    border: 1px solid var(--border);
    background: rgba(24, 24, 27, 0.3);
    border-radius: 6px;
    padding: 1rem;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 0.5rem;
}
.hoy-card:hover { background: rgba(24, 24, 27, 0.5); }
.hoy-card.overdue {
    border-color: var(--red-border);
    background: var(--red-bg);
}
.hoy-card.overdue:hover { background: rgba(239, 68, 68, 0.12); }
.hoy-empty {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(24, 24, 27, 0.3);
}

/* ===== MODALES ===== */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(4px);
    z-index: 50;
    display: flex;
    align-items: stretch;
    justify-content: center;
}
@media (min-width: 640px) {
    .modal-backdrop { align-items: center; padding: 1rem; }
}
.modal {
    background: var(--bg);
    width: 100%;
    max-height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}
@media (min-width: 640px) {
    .modal {
        max-width: 1024px;
        max-height: 90vh;
        border: 1px solid var(--border);
        border-radius: 8px;
    }
}
.modal-narrow { max-width: 720px !important; }

.modal-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.875rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
}
.modal-title { font-size: 1rem; font-weight: 700; }
.modal-subtitle { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.125rem; }
.modal-close {
    padding: 0.5rem;
    border-radius: 4px;
    color: var(--text-muted);
    transition: background 0.15s;
}
.modal-close:hover { background: var(--bg-elevated); color: var(--text); }

.modal-body { padding: 1rem; }
@media (min-width: 640px) { .modal-body { padding: 1.5rem; } }

.modal-footer {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 0.875rem 1.25rem;
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
}

/* Form sections */
.form-section { margin-bottom: 1.5rem; }
.section-title {
    font-family: var(--font-display);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--cyan-hover);
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.875rem;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.875rem;
}
@media (min-width: 640px) {
    .form-grid-2 { grid-template-columns: repeat(2, 1fr); }
    .form-grid-3 { grid-template-columns: repeat(3, 1fr); }
}
.form-grid-4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px) {
    .form-grid-4 { grid-template-columns: repeat(4, 1fr); }
}
.span-2 { grid-column: span 2; }
@media (max-width: 640px) {
    .span-2 { grid-column: span 1; }
}

.range-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}
.range-wrap input[type=range] { flex: 1; accent-color: var(--cyan); }
.range-value {
    font-family: var(--font-display);
    color: var(--cyan-hover);
    width: 3rem;
    text-align: right;
}

/* Sub-etapas */
.subetapas-section {
    background: rgba(24, 24, 27, 0.5);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    margin-top: 1rem;
}
.subetapa-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: center;
    padding: 0.625rem;
    border-radius: 4px;
    background: var(--bg);
    margin-bottom: 0.5rem;
}
.subetapa-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
}
.subetapa-pendiente { background: var(--border); color: var(--text-dim); }
.subetapa-en_curso { background: var(--cyan); color: var(--bg); }
.subetapa-completado { background: var(--emerald); color: var(--bg); }

.subetapa-info { font-size: 0.875rem; }
.subetapa-name { font-weight: 500; }
.subetapa-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.125rem; }

/* JSON paste textarea */
.json-textarea {
    width: 100%;
    height: 16rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem;
    font-family: var(--font-display);
    font-size: 0.75rem;
    color: var(--cyan-hover);
    resize: vertical;
}
.json-textarea:focus { outline: none; border-color: var(--cyan); }

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.875rem;
    font-size: 11px;
    color: var(--text-dim);
}
.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
}

/* ===== TOAST ===== */
.toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--cyan);
    color: var(--bg);
    padding: 0.625rem 1rem;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    font-weight: 700;
    font-size: 0.875rem;
    z-index: 60;
    animation: slideUp 0.2s ease;
}
@keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== LOADING ===== */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
}
.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== EMPTY STATE ===== */
.empty-state {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--text-muted);
}
.empty-state svg { color: var(--text-dim); margin-bottom: 0.75rem; }
.empty-state p { margin-bottom: 0.25rem; }
.empty-state .hint { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 1rem; }

/* ============================================================
 * MENÚ PRINCIPAL · COTIZADOR
 * ============================================================ */

:root {
    --violet: #a855f7;
    --violet-hover: #c084fc;
    --violet-bg: rgba(168, 85, 247, 0.08);
    --violet-border: rgba(168, 85, 247, 0.3);
}

/* ── Menú principal ── */
.main-menu-view {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
.main-menu-topbar {
    padding: 0.875rem 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
}
.main-menu-inner {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1rem;
    background: radial-gradient(ellipse at top, rgba(107,163,31,0.06), transparent 60%);
}
.main-menu-inner > div {
    max-width: 1100px;
    width: 100%;
}
.main-menu-header {
    text-align: center;
    margin-bottom: 2.5rem;
}
.main-menu-eyebrow {
    font-family: var(--font-display);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4em;
    color: var(--cyan);
    margin-bottom: 0.5rem;
}
.main-menu-title {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0.25rem 0 0.5rem;
    color: var(--text);
}
.main-menu-subtitle {
    color: var(--text-muted);
    font-size: 1rem;
    margin: 0;
}
.module-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
}
.module-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    position: relative;
    overflow: hidden;
}
.module-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, currentColor);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
}
.module-card:hover {
    border-color: currentColor;
    transform: translateY(-2px);
}
.module-card:hover::before { opacity: 0.05; }
.module-card.crm { color: var(--cyan); }
.module-card.cotizador { color: var(--violet); }
.module-card.ejecucion { color: var(--emerald); }
.module-card-icon {
    width: 40px; height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid currentColor;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
}
.module-card-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
}
.module-card-desc {
    color: var(--text-muted);
    font-size: 0.8125rem;
    line-height: 1.5;
}
.module-card-stats {
    margin-top: auto;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 1.25rem;
    font-size: 0.75rem;
}
.module-card-stat { display: flex; flex-direction: column; }
.module-card-stat-label {
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
}
.module-card-stat-value {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--text);
    font-size: 1.125rem;
}

/* ── Module pill (en headers) ── */
.module-pill {
    padding: 4px 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-family: var(--font-display);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-left: 0.625rem;
}
.module-pill.cotizador {
    color: var(--violet);
    border-color: var(--violet-border);
    background: var(--violet-bg);
}

/* ── Cotizador shell ── */
.cotizador-header { background: var(--bg-card); border-bottom: 1px solid var(--border); }

/* ── Cotizador: list of proposals ── */
.cot-container { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1rem; }
.cot-header-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem;
}
.cot-view-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.cot-view-subtitle { font-size: 0.875rem; color: var(--text-muted); margin-top: 4px; }
.cot-section-heading {
    font-size: 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 0.875rem;
    margin-top: 0.5rem;
}
.cot-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
}
.proposal-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    cursor: pointer;
    transition: all 0.15s;
}
.proposal-card:hover {
    border-color: var(--violet);
    transform: translateY(-1px);
}
.proposal-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
}
.proposal-card-id {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
}
.proposal-card-title { font-weight: 700; font-size: 1.05rem; margin-top: 4px; }
.proposal-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
    font-size: 0.8125rem;
    color: var(--text-muted);
    margin-top: 0.625rem;
}
.proposal-card-totals {
    margin-top: 0.875rem;
    padding-top: 0.875rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.proposal-card-pv {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--violet);
    font-size: 1rem;
}

/* Status badges (cotizador) */
.cot-status-badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-muted);
}
.cot-status-badge.borrador { background: rgba(113,113,122,0.2); color: var(--text-muted); }
.cot-status-badge.activa { background: var(--cyan-bg); color: var(--cyan-hover); border-color: var(--cyan-border); }
.cot-status-badge.enviada { background: var(--violet-bg); color: var(--violet); border-color: var(--violet-border); }
.cot-status-badge.negociando { background: rgba(245,158,11,0.15); color: var(--amber); border-color: rgba(245,158,11,0.4); }
.cot-status-badge.adjudicada { background: var(--emerald-bg); color: var(--emerald); border-color: rgba(16,185,129,0.4); }
.cot-status-badge.perdida { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
.cot-status-badge.cancelada { background: rgba(113,113,122,0.2); color: var(--text-muted); }

/* Buttons - violet variant */
.btn-primary.violet { background: var(--violet); color: white; }
.btn-primary.violet:hover { background: var(--violet-hover); }
.btn-secondary.violet { color: var(--violet); border-color: var(--violet-border); }
.btn-secondary.violet:hover { background: var(--violet-bg); }

/* ── Cotizador: editor ── */
.cot-editor-topbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
}
.cot-editor-topbar h2 {
    font-size: 1rem;
    font-weight: 700;
    flex: 1;
    min-width: 200px;
    margin: 0;
}
.btn-danger {
    color: var(--red);
    border: 1px solid var(--red-border);
    background: var(--red-bg);
    padding: 0.5rem 0.875rem;
    border-radius: 6px;
    font-size: 0.8125rem;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}
.btn-danger:hover { background: rgba(239,68,68,0.15); }

/* Summary box */
.cot-summary-box {
    background: linear-gradient(135deg, rgba(168,85,247,0.06), rgba(107,163,31,0.04));
    border: 1px solid var(--violet-border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
}
.cot-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
}
.cot-summary-item { display: flex; flex-direction: column; gap: 4px; }
.cot-summary-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
}
.cot-summary-value {
    font-family: var(--font-display);
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--text);
}
.cot-summary-value.big {
    font-size: 1.5rem;
    color: var(--violet);
}

/* Subnav */
.cot-subnav {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.25rem;
    overflow-x: auto;
    padding-bottom: 1px;
}
.cot-subnav-tab {
    padding: 0.625rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-muted);
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: inherit;
}
.cot-subnav-tab:hover { color: var(--text); }
.cot-subnav-tab.active { color: var(--violet); border-bottom-color: var(--violet); }
.cot-subnav-tab .badge {
    display: inline-block;
    padding: 1px 7px;
    margin-left: 0.4rem;
    background: var(--bg-elevated);
    color: var(--text-muted);
    border-radius: 999px;
    font-size: 11px;
    font-family: var(--font-display);
}

/* Cotizador sections */
.cot-section {
    margin-top: 1.25rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-card);
}
.cot-section-header {
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}
.cot-section-title {
    font-size: 0.875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.625rem;
}
.cot-section-title-icon {
    color: var(--violet);
    font-family: var(--font-display);
    font-size: 11px;
    padding: 3px 8px;
    background: var(--violet-bg);
    border-radius: 4px;
    border: 1px solid rgba(168,85,247,0.2);
}
.cot-section-content {
    padding: 1.25rem;
    border-top: 1px solid var(--border);
}

.cot-grid-inputs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.875rem;
}
.cot-input-cell { display: flex; flex-direction: column; gap: 4px; }
.cot-input-cell label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    font-weight: 600;
}
.cot-input-cell input,
.cot-input-cell select,
.cot-input-cell textarea {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    color: var(--text);
    font-size: 0.875rem;
    transition: border-color 0.15s;
    width: 100%;
    font-family: inherit;
}
.cot-input-cell input:focus,
.cot-input-cell select:focus,
.cot-input-cell textarea:focus {
    outline: none;
    border-color: var(--violet);
}
.cot-input-cell textarea { min-height: 100px; resize: vertical; }
.cot-input-cell .hint { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.cot-input-cell input:disabled,
.cot-input-cell select:disabled {
    opacity: 0.6; cursor: not-allowed;
}

.cot-checkbox-cell {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    padding: 0.625rem 0.75rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
}
.cot-checkbox-cell:hover { border-color: var(--border-hover); }
.cot-checkbox-cell.checked { border-color: var(--violet); background: var(--violet-bg); }
.cot-checkbox-cell input { width: auto; margin: 0; }

.lead-state-pill.calificado {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    background: var(--cyan-bg);
    color: var(--cyan);
}

/* Tablas cotizador */
.cot-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
.cot-table th, .cot-table td {
    padding: 0.5rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
}
.cot-table th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    font-weight: 600;
    background: var(--bg-elevated);
    white-space: nowrap;
}
.cot-table td.num, .cot-table th.num { text-align: right; font-family: var(--font-display); }
.cot-table tr.total-row td {
    background: var(--bg-elevated);
    font-weight: 700;
    color: var(--violet);
    border-top: 2px solid rgba(168,85,247,0.4);
    font-family: var(--font-display);
}
.cot-table input,
.cot-table select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    color: var(--text);
    font-size: 0.8125rem;
    width: 100%;
    font-family: inherit;
}
.cot-table input:focus,
.cot-table select:focus { outline: none; border-color: var(--violet); }

/* Equipo picker (modal) */
.equipo-picker-list {
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
}
.equipo-picker-row {
    padding: 0.625rem 0.875rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.625rem;
    align-items: center;
}
.equipo-picker-row:last-child { border-bottom: none; }
.equipo-picker-row:hover { background: var(--bg-elevated); }
.equipo-picker-row.selected { background: var(--violet-bg); }
.equipo-picker-row input[type=checkbox] { margin: 0; }
.equipo-picker-tag {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--cyan);
    padding: 2px 8px;
    border: 1px solid var(--cyan-border);
    border-radius: 4px;
    background: var(--cyan-bg);
}

/* Prompt preview */
.prompt-preview {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    font-family: var(--font-display);
    font-size: 0.75rem;
    line-height: 1.6;
    color: var(--text-muted);
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
}

.cot-flex-spread {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}
.cot-text-violet { color: var(--violet); }
.cot-text-emerald { color: var(--emerald); }
.cot-text-amber { color: var(--amber); }
.cot-text-cyan { color: var(--cyan); }
.cot-text-muted { color: var(--text-muted); }
.cot-text-dim { color: var(--text-dim); }
.cot-text-xs { font-size: 0.75rem; }
.cot-mono { font-family: var(--font-display); }

@media (max-width: 700px) {
    .cot-grid-inputs { grid-template-columns: 1fr 1fr; }
    .cot-summary-grid { grid-template-columns: 1fr 1fr; }
    .cot-summary-value.big { font-size: 1.25rem; }
    .cot-table { font-size: 12px; }
    .cot-table th, .cot-table td { padding: 0.375rem 0.5rem; }
}

/* ============================================================
   NASE Agrotech · añadidos (modal de lead, grid de formulario)
   ============================================================ */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(4px);
    display:flex; align-items:flex-start; justify-content:center; padding:2.5rem 1rem; z-index:1000; overflow-y:auto; }
.modal-card { width:100%; max-width:560px; background:var(--bg-card); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.55); }
.modal-lg { max-width:880px; }
.form-section-title { font-family:var(--font-display); font-size:11px; text-transform:uppercase;
    letter-spacing:.12em; color:var(--cyan-hover); margin:1.5rem 0 .75rem; padding-bottom:.35rem;
    border-bottom:1px solid var(--border); }
.form-section-title:first-child { margin-top:0; }
/* Formulario de lead: 2 columnas en desktop */
.form-grid { display:grid; grid-template-columns:1fr; gap:.875rem; }
@media (min-width:640px) { .form-grid { grid-template-columns:repeat(2,1fr); } }
.span2 { grid-column:1 / -1; }
.field-hint { display:flex; align-items:center; font-size:.8125rem; color:var(--text-muted); }
/* Caption directo en <label class="field">Texto<input></label> */
.field { font-family:var(--font-display); font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-muted); }
.field input, .field select, .field textarea { font-family:var(--font-body); font-size:.875rem; text-transform:none; letter-spacing:normal; color:var(--text); }

</style>
</head>

<script>

/* core/constants.js */
// ============================================================
// NASE Agrotech CRM · Constantes, modelo de datos y estado
// Venta de drones agrícolas (DJI Agras) — pipeline comercial
// ============================================================

// ── INIT SUPABASE ──

}
const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

// ── CONSTANTES DE DOMINIO ──
const ESTADOS = ['Lead', 'Calificado', 'Cotizado', 'Negociando', 'Ganado', 'Perdido', 'Pausado'];

// Cultivos típicos para aplicación con dron (LatAm). Editable.
const CULTIVOS = [
    'Maíz', 'Trigo', 'Arroz', 'Soya', 'Caña de azúcar', 'Papa', 'Café', 'Banano',
    'Palma aceitera', 'Aguacate/Palta', 'Cítricos', 'Vid/Viñedo', 'Arándano', 'Cerezo',
    'Hortalizas', 'Pastura/Forraje', 'Algodón', 'Otro'
];

// Catálogo de modelos DJI Agras que comercializa NASE. Editable.
const MODELOS_DRON = ['DJI Agras T25P', 'DJI Agras T55', 'DJI Agras T70P', 'DJI Agras T100', 'Otro / a definir'];

// Reglas de recomendación por área (ha). Modificables: el vendedor puede
// override el modelo en el formulario. Umbrales pensados para rendimiento
// razonable por jornada de aplicación.
const REGLAS_MODELO = [
    { maxHa: 30, modelo: 'DJI Agras T25P' },
    { maxHa: 80, modelo: 'DJI Agras T55' },
    { maxHa: 200, modelo: 'DJI Agras T70P' },
    { maxHa: Infinity, modelo: 'DJI Agras T100' },
];

// Devuelve el modelo sugerido según el área. Se usa como default (editable).
function recomendarModelo(areaHa) {
    const ha = Number(areaHa) || 0;
    if (ha <= 0) return '';
    const regla = REGLAS_MODELO.find(r => ha <= r.maxHa);
    return regla ? regla.modelo : 'DJI Agras T100';
}

const PROBABILIDAD_DEFAULT = { 'Lead': 10, 'Calificado': 25, 'Cotizado': 50, 'Negociando': 75, 'Ganado': 100, 'Perdido': 0, 'Pausado': 15 };

// ── HELPERS DE FECHA (hora LOCAL, no UTC) ──
const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const dateToLocalISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const isOverdue = (d) => d && d < today();
const isToday = (d) => d === today();
const getWeekDays = () => {
    const days = []; const start = new Date(); start.setHours(0, 0, 0, 0);
    for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(d.getDate() + i); days.push(dateToLocalISO(d)); }
    return days;
};
const dayName = (s) => { const [y, m, d] = s.split('-').map(Number); return ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][new Date(y, m - 1, d).getDay()]; };
const dayShort = (s) => { const [y, m, d] = s.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${dt.getDate()} ${['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][dt.getMonth()]}`; };

// ── HELPERS DE FORMATO ──
const fmtMoney = (n, cur) => (!n && n !== 0) ? '—' : new Intl.NumberFormat('en-US', { style: 'currency', currency: cur || 'USD', maximumFractionDigits: 0 }).format(n);
const fmtUSD = (n) => fmtMoney(n, 'USD');
const fmtHa = (n) => (!n && n !== 0) ? '—' : `${new Intl.NumberFormat('es-CL').format(Number(n) || 0)} ha`;
const escapeHTML = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── AUDITORÍA ──
const CAMPOS_LABEL = {
    estado: 'Estado', clasificacion: 'Clasificación', tipo_cultivo: 'Cultivo', area_ha: 'Área (ha)',
    fecha_aplicacion: 'Fecha aplicación', modelo_recomendado: 'Modelo', usd_estimado: 'USD estimado',
    probabilidad_pct: 'Probabilidad', cotizacion_competencia: 'Cotiz. competencia', vendedor: 'Vendedor',
    proxima_accion: 'Próxima acción', fecha_proxima_accion: 'Fecha próxima', razon_social: 'Empresa',
    contacto_principal: 'Contacto', causa_perdida: 'Causa pérdida', lead_creado: 'Lead creado',
};
const formatAuditValue = (campo, v) => {
    if (v == null || v === '') return '(vacío)';
    if (campo === 'usd_estimado') return fmtUSD(parseFloat(v) || 0);
    if (campo === 'area_ha') return fmtHa(v);
    if (campo === 'probabilidad_pct') return v + '%';
    return String(v).length > 60 ? String(v).slice(0, 60) + '…' : v;
};
const formatAuditTimestamp = (ts) => {
    const d = new Date(ts); const p = n => String(n).padStart(2, '0');
    return `${d.getDate()}-${['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'][d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

// ── ESTADO GLOBAL ──
const state = {
    user: null,
    leads: [],
    auditLog: [],
    view: 'dashboard',
    filterEstado: 'all',
    filterClasificacion: 'all',
    filterCultivo: 'all',
    filterVendedor: 'all',
    search: '',
};

// ── LEAD helpers ──
const generateLeadID = () => {
    let max = 0;
    state.leads.forEach(l => { const m = l.lead_id?.match(/^LEAD-(\d+)$/); if (m) max = Math.max(max, parseInt(m[1])); });
    return `LEAD-${String(max + 1).padStart(3, '0')}`;
};

const emptyLead = () => ({
    lead_id: '', estado: 'Lead', lead_source: '', fecha_primer_contacto: today(),
    clasificacion: 'Agrícola', tipo_cultivo: '', area_ha: 0, fecha_aplicacion: '',
    modelo_recomendado: '',
    razon_social: '', contacto_principal: '', cargo: '', email: '', telefono: '', whatsapp: '',
    ciudad_pais: '',
    usd_estimado: 0, moneda: 'USD', probabilidad_pct: 10,
    cotizacion_competencia: 'No', competencia_detalle: '',
    proxima_accion: '', fecha_proxima_accion: '', ultima_actividad: '',
    vendedor: '', notas: '', causa_perdida: '',
    fecha_cotizado: '', fecha_cerrado: '',
});

// Vendedor por defecto = quien crea el lead (nombre o email del usuario logueado).
const vendedorActual = () => (state.user?.user_metadata?.nombre || state.user?.email || '').trim();

// Lista de vendedores presentes en los leads (para el filtro del pipeline).
const listaVendedores = () => [...new Set(state.leads.map(l => l.vendedor).filter(Boolean))].sort();

// Un lead necesita "conseguir cotización de la competencia" como hito.
const faltaCotizCompetencia = (l) => (l.cotizacion_competencia || 'No') === 'No' && !['Ganado', 'Perdido'].includes(l.estado);

const parseFlexibleJSON = (raw) => {
    if (!raw || typeof raw !== 'string') throw new Error('JSON vacío');
    let s = raw.trim().replace(/^﻿/, '').replace(/[​-‍]/g, '');
    s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    s = s.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
    if (!s.includes('"') && s.includes("'")) s = s.replace(/'/g, '"');
    s = s.replace(/,(\s*[}\]])/g, '$1');
    return JSON.parse(s);
};

// ── UI helpers ──
const showToast = (msg) => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
};
const showLoading = (show) => { document.getElementById('loading').style.display = show ? 'flex' : 'none'; };


/* core/auth.js */
// ============================================================
// NASE Agrotech CRM · Auth + carga/guardado de datos (Supabase)
// ============================================================

function showLogin() {
    document.getElementById('login-view').style.display = 'flex';
    document.getElementById('app-view').style.display = 'none';
}
function showApp() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
    const email = state.user?.email || '';
    document.getElementById('user-email').textContent = vendedorActual() || email;
}

// ── AUTH ──
async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { state.user = session.user; showApp(); await loadData(); }
    else showLogin();
}
async function login(email, password) {
    showLoading(true);
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    showLoading(false);
    if (error) { return showAuthError(error.message); }
    state.user = data.user; showApp(); await loadData();
}
async function signup(email, password) {
    showLoading(true);
    const { error } = await supabase.auth.signUp({ email, password });
    showLoading(false);
    if (error) return showAuthError(error.message);
    const s = document.getElementById('login-success');
    s.textContent = '✓ Cuenta creada. Revisá tu email para confirmar y luego iniciá sesión.';
    s.style.display = 'block';
    document.getElementById('login-error').style.display = 'none';
}
async function resetPassword(email) {
    showLoading(true);
    const { error } = await supabase.auth.resetPasswordForEmail(email);
    showLoading(false);
    if (error) return showAuthError(error.message);
    const s = document.getElementById('login-success');
    s.textContent = '✓ Email de recuperación enviado.'; s.style.display = 'block';
}
async function logout() {
    await supabase.auth.signOut();
    state.user = null; state.leads = []; state.auditLog = [];
    location.reload();
}
function showAuthError(msg) {
    const e = document.getElementById('login-error');
    e.textContent = msg; e.style.display = 'block';
}

// ── CARGA ──
async function loadData() {
    showLoading(true);
    const [{ data: leadsData, error: e1 }, { data: auditData }] = await Promise.all([
        supabase.from('leads').select('*').order('created_at', { ascending: false }),
        supabase.from('audit_log').select('*').order('timestamp', { ascending: false }).limit(500),
    ]);
    showLoading(false);
    if (e1) { showToast('Error cargando leads: ' + e1.message); return; }
    state.leads = leadsData || [];
    state.auditLog = auditData || [];
    render();
}
async function refreshAuditLog() {
    const { data } = await supabase.from('audit_log').select('*').order('timestamp', { ascending: false }).limit(500);
    state.auditLog = data || [];
}

// Limpia fechas vacías -> null y numéricos -> número, antes de Postgres.
const cleanLeadForSave = (lead) => {
    const dates = ['fecha_primer_contacto', 'fecha_aplicacion', 'fecha_proxima_accion', 'fecha_cotizado', 'fecha_cerrado'];
    const nums = ['usd_estimado', 'probabilidad_pct', 'area_ha'];
    const c = { ...lead };
    dates.forEach(f => { if (c[f] === '' || c[f] === undefined) c[f] = null; });
    nums.forEach(f => { c[f] = (c[f] === '' || c[f] == null) ? 0 : (Number(c[f]) || 0); });
    return c;
};

async function saveLead(lead) {
    showLoading(true);
    const isNew = !lead.id;
    // El modelo se auto-recomienda si quedó vacío.
    if (!lead.modelo_recomendado && lead.area_ha) lead.modelo_recomendado = recomendarModelo(lead.area_ha);
    if (isNew) {
        if (!lead.lead_id) lead.lead_id = generateLeadID();
        if (!lead.vendedor) lead.vendedor = vendedorActual();     // vendedor = creador
        const { id, ...data } = cleanLeadForSave(lead);
        data.created_by = state.user?.id || null;
        data.updated_by = state.user?.id || null;
        const { data: row, error } = await supabase.from('leads').insert(data).select().single();
        showLoading(false);
        if (error) { showToast('Error: ' + error.message); return false; }
        state.leads = [row, ...state.leads];
        showToast(`✓ ${row.lead_id} creado`);
    } else {
        const { id, created_at, created_by, ...data } = cleanLeadForSave(lead);
        data.updated_by = state.user?.id || null;
        const { data: row, error } = await supabase.from('leads').update(data).eq('id', id).select().single();
        showLoading(false);
        if (error) { showToast('Error: ' + error.message); return false; }
        state.leads = state.leads.map(l => l.id === id ? row : l);
        showToast(`✓ ${row.lead_id} actualizado`);
    }
    await refreshAuditLog();
    render();
    return true;
}

async function deleteLead(leadId) {
    const lead = state.leads.find(l => l.lead_id === leadId);
    if (!lead) return;
    if (!confirm(`¿Eliminar ${leadId}?`)) return;
    showLoading(true);
    const { error } = await supabase.from('leads').delete().eq('id', lead.id);
    showLoading(false);
    if (error) { showToast('Error: ' + error.message); return; }
    state.leads = state.leads.filter(l => l.id !== lead.id);
    await refreshAuditLog();
    showToast(`✓ ${leadId} eliminado`);
    render();
}


/* core/events.js */
// ============================================================
// NASE Agrotech CRM · setupEvents (router de eventos del DOM)
// ============================================================
function setupEvents() {

        signup(email, pass);
    });
    document.getElementById('forgot-password').addEventListener('click', () => {
        const email = document.getElementById('login-email').value;
        if (!email) return showAuthError('Poné tu email primero');
        resetPassword(email);
    });

    // Nav tabs
    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const view = tab.dataset.view;
            state.view = view;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
            ['dashboard', 'kanban', 'agenda', 'auditoria'].forEach(v => {
                const el = document.getElementById('view-' + v);
                if (el) el.style.display = v === view ? 'block' : 'none';
            });
        });
    });

    // Acciones
    document.getElementById('btn-new-lead').addEventListener('click', () => openLeadForm(null));
    document.getElementById('btn-paste-json').addEventListener('click', () => openPasteJSON());
    document.getElementById('btn-export').addEventListener('click', exportCSV);
    document.getElementById('btn-logout').addEventListener('click', logout);

    // Filtros
    document.getElementById('search-input').addEventListener('input', (e) => { state.search = e.target.value; renderTable(); });
    document.getElementById('filter-estado').addEventListener('change', (e) => { state.filterEstado = e.target.value; renderTable(); renderKanban(); });
    document.getElementById('filter-clasificacion').addEventListener('change', (e) => { state.filterClasificacion = e.target.value; renderTable(); renderKanban(); });
    document.getElementById('filter-cultivo').addEventListener('change', (e) => { state.filterCultivo = e.target.value; renderTable(); renderKanban(); });
    document.getElementById('filter-vendedor').addEventListener('change', (e) => { state.filterVendedor = e.target.value; renderTable(); renderKanban(); });
}


/* modules/crm/crm.js */
// ============================================================
// NASE Agrotech CRM · Vistas (dashboard, pipeline, agenda, auditoría)
// + formulario de lead con recomendación de modelo DJI Agras
// ============================================================

function render() {
    renderFilters();
    renderKPIs();
    renderTable();
    renderKanban();
    renderAgenda();
    renderAuditoria();
}

// ── Filtrado / orden ──
function getFilteredLeads() {
    let r = state.leads;
    if (state.filterEstado !== 'all') r = r.filter(l => l.estado === state.filterEstado);
    if (state.filterClasificacion !== 'all') r = r.filter(l => l.clasificacion === state.filterClasificacion);
    if (state.filterCultivo !== 'all') r = r.filter(l => (l.tipo_cultivo || '') === state.filterCultivo);
    if (state.filterVendedor !== 'all') r = r.filter(l => (l.vendedor || '') === state.filterVendedor);
    if (state.search) {
        const s = state.search.toLowerCase();
        r = r.filter(l =>
            l.razon_social?.toLowerCase().includes(s) ||
            l.contacto_principal?.toLowerCase().includes(s) ||
            l.lead_id?.toLowerCase().includes(s) ||
            l.tipo_cultivo?.toLowerCase().includes(s) ||
            l.vendedor?.toLowerCase().includes(s));
    }
    return r;
}
function getSortedLeads() {
    return [...getFilteredLeads()].sort((a, b) => {
        const aC = a.estado === 'Ganado' || a.estado === 'Perdido';
        const bC = b.estado === 'Ganado' || b.estado === 'Perdido';
        if (aC && !bC) return 1;
        if (!aC && bC) return -1;
        return (b.usd_estimado || 0) * (b.probabilidad_pct || 0) - (a.usd_estimado || 0) * (a.probabilidad_pct || 0);
    });
}

// ── Filtros (poblar selects) ──
function renderFilters() {
    const fE = document.getElementById('filter-estado');
    const fC = document.getElementById('filter-clasificacion');
    const fCu = document.getElementById('filter-cultivo');
    const fV = document.getElementById('filter-vendedor');
    if (fE && fE.children.length === 1) ESTADOS.forEach(e => fE.insertAdjacentHTML('beforeend', `<option value="${e}">${e}</option>`));
    if (fC && fC.children.length === 1) CLASIFICACIONES.forEach(c => fC.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`));
    if (fCu && fCu.children.length === 1) CULTIVOS.forEach(c => fCu.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`));
    // Vendedor se repuebla siempre (cambia con los datos)
    if (fV) {
        const cur = state.filterVendedor;
        fV.innerHTML = '<option value="all">Todos los vendedores</option>' +
            listaVendedores().map(v => `<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`).join('');
        fV.value = listaVendedores().includes(cur) ? cur : 'all';
    }
}

// ── KPIs ──
function renderKPIs() {
    const ls = state.leads;
    const ganados = ls.filter(l => l.estado === 'Ganado');
    const perdidos = ls.filter(l => l.estado === 'Perdido');
    const cot = ls.filter(l => ['Cotizado', 'Negociando'].includes(l.estado));
    const pUSD = cot.reduce((s, l) => s + (l.usd_estimado || 0), 0);
    const pPond = cot.reduce((s, l) => s + (l.usd_estimado || 0) * (l.probabilidad_pct || 0) / 100, 0);
    const winRate = (ganados.length + perdidos.length) ? ganados.length / (ganados.length + perdidos.length) : 0;
    const activos = ls.filter(l => !['Ganado', 'Perdido'].includes(l.estado));
    const accVenc = activos.filter(l => l.fecha_proxima_accion && l.fecha_proxima_accion < today()).length;
    const accHoy = activos.filter(l => l.fecha_proxima_accion === today()).length;
    const faltaComp = ls.filter(faltaCotizCompetencia).length;

    const kpis = [
        { label: 'Pipeline activo', value: fmtUSD(pUSD), sub: `${cot.length} cotizados/negoc.`, accent: 'cyan' },
        { label: 'Pipeline ponderado', value: fmtUSD(pPond), sub: 'USD × probabilidad', accent: 'emerald' },
        { label: 'Win rate', value: `${(winRate * 100).toFixed(0)}%`, sub: `${ganados.length} ganados / ${perdidos.length} perdidos`, accent: 'amber' },
        { label: 'Acciones hoy', value: accHoy + accVenc, sub: accVenc > 0 ? `⚠ ${accVenc} vencidas` : 'al día', accent: accVenc > 0 ? 'red' : 'cyan' },
        { label: 'Falta cotiz. competencia', value: faltaComp, sub: 'hito por conseguir', accent: faltaComp > 0 ? 'amber' : 'emerald' },
    ];
    document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
        <div class="kpi-card kpi-${k.accent}">
            <div class="kpi-header"><span class="kpi-label">${k.label}</span></div>
            <div class="kpi-value">${k.value}</div>
            <div class="kpi-sublabel">${k.sub}</div>
        </div>`).join('');

    const badge = document.getElementById('badge-agenda');
    if (badge) { const t = accHoy + accVenc; badge.style.display = t > 0 ? 'inline-block' : 'none'; badge.textContent = t; }
}

// ── Tabla (dashboard) ──
function renderTable() {
    const sorted = getSortedLeads();
    const top5 = sorted.slice(0, 5).map(l => l.lead_id);
    document.getElementById('leads-count').textContent = `${sorted.length} de ${state.leads.length} leads`;
    const container = document.getElementById('leads-table');
    if (!sorted.length) {
        container.innerHTML = `<div class="empty-state"><p>Sin leads</p><p class="hint">Creá uno con “+ Nuevo” o pegá un JSON.</p><button class="btn-primary" onclick="window.openLeadForm(null)">+ Crear primer lead</button></div>`;
        return;
    }
    const rows = sorted.map(l => {
        const pond = (l.usd_estimado || 0) * (l.probabilidad_pct || 0) / 100;
        const over = isOverdue(l.fecha_proxima_accion), tod = isToday(l.fecha_proxima_accion);
        const prio = top5.includes(l.lead_id);
        const cultivo = l.clasificacion === 'Agrícola' ? (l.tipo_cultivo || '—') : 'Industrial';
        return `
        <tr class="lead-row" data-id="${l.id}">
            <td class="lead-id-cell">${prio ? '<span class="priority-star">★</span>' : ''}${escapeHTML(l.lead_id)}</td>
            <td><span class="estado-pill estado-${l.estado}">${l.estado}</span>${faltaCotizCompetencia(l) ? '<div style="margin-top:.25rem;font-size:10px;color:#f59e0b;font-family:var(--font-display)">⚠ falta cotiz. competencia</div>' : ''}</td>
            <td><div class="empresa-name">${escapeHTML(l.razon_social || '—')}</div><div class="empresa-contact">${escapeHTML(l.contacto_principal || '')}${l.ciudad_pais ? ' · ' + escapeHTML(l.ciudad_pais) : ''}</div></td>
            <td><div style="font-size:.8125rem">${escapeHTML(cultivo)}</div><div style="font-size:.6875rem;color:var(--text-dim)">${escapeHTML(l.clasificacion || '')}</div></td>
            <td><div style="font-size:.8125rem">${fmtHa(l.area_ha)}</div><div style="font-size:.6875rem;color:var(--cyan-hover)">${escapeHTML(l.modelo_recomendado || '—')}</div></td>
            <td class="right"><div class="usd-main">${fmtMoney(l.usd_estimado, l.moneda)}</div><div class="usd-sub">${l.probabilidad_pct || 0}% · ${fmtUSD(pond)}</div></td>
            <td><div class="${over ? 'fecha-overdue' : tod ? 'fecha-today' : ''}" style="font-size:.75rem">${l.fecha_proxima_accion ? `${over ? '⚠ ' : ''}${tod ? '⏰ ' : ''}${l.fecha_proxima_accion}` : '<span style="color:var(--text-dim)">sin fecha</span>'}</div><div class="proxima-accion" title="${escapeHTML(l.proxima_accion || '')}">${escapeHTML(l.proxima_accion || '—')}</div><div style="font-size:10px;color:var(--text-dim)">👤 ${escapeHTML(l.vendedor || '—')}</div></td>
            <td><div class="action-btns">
                <button class="icon-btn" onclick="window.openEditLead('${l.id}')" title="Editar">✎</button>
                <button class="icon-btn ai" onclick="window.copyLeadAI('${l.id}')" title="Copiar prompt IA: actualiza este lead con cualquier IA">✨</button>
                <button class="icon-btn danger" onclick="window.deleteLeadById('${escapeHTML(l.lead_id)}')" title="Eliminar">🗑</button>
            </div></td>
        </tr>`;
    }).join('');
    container.innerHTML = `<div class="table-scroll"><table>
        <thead><tr><th>Lead</th><th>Estado</th><th>Empresa / Zona</th><th>Clasif. / Cultivo</th><th>Área · Modelo</th><th class="right">Valor · Prob.</th><th>Próxima acción · Vendedor</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
}

// ── Pipeline (kanban) ──
function renderKanban() {
    const filtered = getFilteredLeads();
    const groups = {}; ESTADOS.forEach(e => groups[e] = []);
    filtered.forEach(l => groups[l.estado]?.push(l));
    document.getElementById('kanban-board').innerHTML = ESTADOS.map(estado => {
        const leads = groups[estado];
        const totalUSD = leads.reduce((s, l) => s + (l.usd_estimado || 0), 0);
        const cards = leads.map(l => {
            const cultivo = l.clasificacion === 'Agrícola' ? (l.tipo_cultivo || 'Agrícola') : 'Industrial';
            return `
            <div class="kanban-card" onclick="window.openEditLead('${l.id}')">
                <div class="kanban-card-id">${escapeHTML(l.lead_id)} · 👤 ${escapeHTML(l.vendedor || '—')}</div>
                <div class="kanban-card-title">${escapeHTML(l.razon_social || '—')}</div>
                <div class="kanban-card-meta">${escapeHTML(cultivo)}${l.area_ha ? ' · ' + fmtHa(l.area_ha) : ''}</div>
                <div class="kanban-card-meta" style="color:var(--cyan-hover)">${escapeHTML(l.modelo_recomendado || '')}</div>
                <div class="kanban-card-footer"><span style="font-weight:600">${fmtMoney(l.usd_estimado, l.moneda)}</span><span style="color:var(--cyan-hover)">${l.probabilidad_pct || 0}%</span></div>
                ${faltaCotizCompetencia(l) ? '<div style="font-size:10px;margin-top:.25rem;color:#f59e0b;font-family:var(--font-display)">⚠ conseguir cotiz. competencia</div>' : ''}
                ${l.fecha_proxima_accion ? `<div style="font-size:10px;margin-top:.25rem;font-family:var(--font-display);color:${isOverdue(l.fecha_proxima_accion) ? '#fca5a5' : isToday(l.fecha_proxima_accion) ? '#fcd34d' : 'var(--text-dim)'}">${isOverdue(l.fecha_proxima_accion) ? '⚠ ' : ''}${l.fecha_proxima_accion}</div>` : ''}
            </div>`;
        }).join('');
        return `<div class="kanban-col" data-estado="${estado}">
            <div class="kanban-col-header"><div class="kanban-col-title"><span>${estado}</span><span class="kanban-col-count">${leads.length}</span></div><div class="kanban-col-usd">${fmtUSD(totalUSD)}</div></div>
            <div class="kanban-col-body">${cards}</div></div>`;
    }).join('');
}

// ── Agenda (próximas acciones + hito de competencia) ──
function renderAgenda() {
    const cont = document.getElementById('view-agenda');
    if (!cont) return;
    const activos = state.leads.filter(l => !['Ganado', 'Perdido'].includes(l.estado));
    const conAccion = activos.filter(l => l.fecha_proxima_accion)
        .sort((a, b) => (a.fecha_proxima_accion || '').localeCompare(b.fecha_proxima_accion || ''));
    const faltaComp = activos.filter(faltaCotizCompetencia);

    const card = (l, extra) => {
        const over = isOverdue(l.fecha_proxima_accion), tod = isToday(l.fecha_proxima_accion);
        const dias = over ? Math.floor((Date.now() - new Date(l.fecha_proxima_accion).getTime()) / 86400000) : 0;
        return `<div class="hoy-card ${over ? 'overdue' : ''}" onclick="window.openEditLead('${l.id}')">
            <div style="display:flex;justify-content:space-between;gap:1rem">
                <div style="flex:1">
                    <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.25rem">
                        <span style="font-family:var(--font-display);font-size:11px;color:var(--text-dim)">${escapeHTML(l.lead_id)}</span>
                        <span class="estado-pill estado-${l.estado}">${l.estado}</span>
                        ${over ? `<span style="font-size:11px;color:#fca5a5;font-weight:700">⚠ VENCIDO ${dias}d</span>` : tod ? '<span style="font-size:11px;color:#fcd34d;font-weight:700">⏰ HOY</span>' : ''}
                    </div>
                    <div style="font-weight:600">${escapeHTML(l.razon_social || '—')}</div>
                    <div style="font-size:.875rem;color:var(--text-muted)">→ ${escapeHTML(extra || l.proxima_accion || '')}</div>
                    <div style="font-size:.75rem;color:var(--text-dim)">👤 ${escapeHTML(l.vendedor || '—')}${l.telefono ? ' · ' + escapeHTML(l.telefono) : ''}</div>
                </div>
                <div style="text-align:right"><div style="font-family:var(--font-display);font-weight:700">${fmtMoney(l.usd_estimado, l.moneda)}</div><div style="font-family:var(--font-display);font-size:.75rem;color:var(--cyan-hover)">${l.probabilidad_pct || 0}%</div>${l.fecha_proxima_accion ? `<div style="font-size:11px;color:var(--text-dim);margin-top:.25rem">${l.fecha_proxima_accion}</div>` : ''}</div>
            </div></div>`;
    };

    let html = `<div class="container container-narrow"><h2 class="view-title">Agenda</h2><p class="view-subtitle">${conAccion.length} próximas acciones · ${faltaComp.length} sin cotización de competencia</p>`;
    if (faltaComp.length) {
        html += `<div style="border:1px solid var(--amber);background:var(--amber-bg);border-radius:6px;padding:1rem;margin:1rem 0">
            <div style="font-weight:700;color:var(--amber);margin-bottom:.5rem">⚠ Hito: conseguir cotización de la competencia (${faltaComp.length})</div>
            ${faltaComp.map(l => card(l, 'Conseguir/registrar la cotización de la competencia')).join('')}</div>`;
    }
    html += conAccion.length ? conAccion.map(l => card(l)).join('') : `<div class="hoy-empty"><p>Sin acciones agendadas</p><p class="hint">Cargá una próxima acción en cada lead activo.</p></div>`;
    html += `</div>`;
    cont.innerHTML = html;
}

// ── Auditoría ──
function renderAuditoria() {
    const cont = document.getElementById('view-auditoria');
    if (!cont) return;
    const logs = [...state.auditLog].slice(0, 200);
    let html = `<div class="container"><h2 class="view-title">Auditoría</h2><p class="view-subtitle">${state.auditLog.length} cambios registrados</p>`;
    if (!logs.length) { cont.innerHTML = html + `<div class="empty-state"><p>Sin cambios aún</p></div></div>`; return; }
    html += `<div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg-card)">`;
    logs.forEach((log, i) => {
        const lead = state.leads.find(l => l.id === log.lead_id);
        const empresa = lead?.razon_social || lead?.lead_id || '(lead eliminado)';
        const campo = CAMPOS_LABEL[log.campo] || log.campo;
        const desc = log.accion === 'INSERT' ? '<span style="color:#6ee7b7;font-weight:600">Lead creado</span>'
            : log.accion === 'DELETE' ? '<span style="color:#fca5a5;font-weight:600">Lead eliminado</span>'
            : `<span style="color:var(--cyan-hover)">${escapeHTML(campo)}</span>: <span style="color:var(--text-dim)">${escapeHTML(formatAuditValue(log.campo, log.valor_anterior))}</span> → <span style="color:var(--text)">${escapeHTML(formatAuditValue(log.campo, log.valor_nuevo))}</span>`;
        html += `<div style="padding:.75rem 1rem;border-bottom:${i < logs.length - 1 ? '1px solid var(--border)' : 'none'};display:flex;gap:.875rem">
            <div style="flex:1"><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.125rem"><span style="font-family:var(--font-display);font-size:10px;color:var(--text-dim)">${formatAuditTimestamp(log.timestamp)}</span><span style="font-size:.75rem;color:var(--text-muted)">${escapeHTML(log.user_email || 'sistema')}</span></div>
            <div style="font-size:.875rem"><span style="font-weight:500">${escapeHTML(empresa)}</span> <span style="color:var(--text-dim)">·</span> ${desc}</div></div></div>`;
    });
    cont.innerHTML = html + `</div></div>`;
}

            <label class="field">Vendedor<input name="vendedor" value="${escapeHTML(lead.vendedor || vendedorActual())}"></label>
            <label class="field span2">Última actividad<input name="ultima_actividad" value="${escapeHTML(lead.ultima_actividad)}"></label>
            <label class="field span2">Notas<textarea name="notas" rows="3">${escapeHTML(lead.notas)}</textarea></label>
          </div>

          <div class="modal-footer">

            <button type="submit" class="btn-primary">${id ? 'Guardar cambios' : 'Crear lead'}</button>
          </div>
        </form>
      </div>
    </div>`;
    document.getElementById('modal-root').innerHTML = html;

    // Interacciones del formulario
    const form = document.getElementById('lead-form');
    const area = document.getElementById('f-area');
    const modeloSel = document.getElementById('f-modelo');
    const hint = document.getElementById('modelo-hint');
    let modeloTocado = !!id && !!lead.modelo_recomendado;   // en edición respetamos lo elegido
    modeloSel.addEventListener('change', () => { modeloTocado = true; });
    const aplicarReco = () => {
        const rec = recomendarModelo(area.value);
        hint.innerHTML = `Sugerido por área: <b>${escapeHTML(rec || '—')}</b>`;
        if (!modeloTocado && rec) modeloSel.value = rec;   // auto-set si el usuario no lo tocó
    };
    area.addEventListener('input', aplicarReco);
    document.getElementById('f-clasificacion').addEventListener('change', (e) => {
        const ag = e.target.value === 'Agrícola';
        document.getElementById('wrap-cultivo').style.display = ag ? '' : 'none';
        document.getElementById('wrap-fecha-aplic').style.display = ag ? '' : 'none';
    });
    document.getElementById('f-comp').addEventListener('change', (e) => {
        document.getElementById('wrap-comp-det').style.display = e.target.value === 'Sí' ? '' : 'none';
    });
    document.getElementById('f-estado').addEventListener('change', (e) => {
        document.getElementById('wrap-causa').style.display = e.target.value === 'Perdido' ? '' : 'none';
    });
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const upd = { ...lead };
        fd.forEach((v, k) => { upd[k] = v; });
        if ((upd.clasificacion || '') !== 'Agrícola') { upd.tipo_cultivo = ''; upd.fecha_aplicacion = ''; }
        const okSaved = await saveLead(upd);
        if (okSaved) closeModal();
    });
}

// ── Asistente IA: copia los datos del lead + prompt para cualquier IA ──
function buildLeadAIPrompt(l) {
    return [
        'Actúa como asistente del CRM de NASE Agrotech (venta de drones agrícolas DJI Agras).',
        '',
        'DATOS ACTUALES DEL LEAD (JSON):',
        JSON.stringify(l, null, 2),
        '',
        'TAREA:',
        '1. Abajo, en "INFORMACIÓN NUEVA", te entrego novedades de este lead (llamada, WhatsApp, reunión, correo).',
        '2. Incorpóralas actualizando SOLO los campos que corresponda; conserva el resto exactamente igual. NUNCA cambies "id" ni "lead_id".',
        '3. Valores permitidos — estado: Lead, Calificado, Cotizado, Negociando, Ganado, Perdido, Pausado · clasificacion: Agrícola, Industrial · cotizacion_competencia: Sí, No · fechas: AAAA-MM-DD · area_ha, usd_estimado, probabilidad_pct: números.',
        '4. Suma al inicio de "notas" una línea con la fecha de hoy y el resumen de lo nuevo, conservando las notas anteriores.',
        '5. Actualiza "ultima_actividad", "proxima_accion" y "fecha_proxima_accion" si la información lo amerita.',
        '6. Responde ÚNICAMENTE con el objeto JSON completo actualizado, sin explicaciones ni bloques de código.',
        '',
        'Después pegaré tu respuesta en el CRM (botón "JSON") para actualizar el lead.',
        '',
        'INFORMACIÓN NUEVA:',
        '[escribe aquí la información nueva]',
    ].join('\n');
}
function copyTextFallback(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert('No se pudo copiar al portapapeles'); }
    document.body.removeChild(ta);
}
window.copyLeadAI = (id) => {
    const l = state.leads.find(x => x.id === id);
    if (!l) return;
    const prompt = buildLeadAIPrompt(l);
    const done = () => showToast(`✨ Prompt IA de ${l.lead_id} copiado — pégalo en tu IA junto a la información nueva`);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(prompt).then(done, () => copyTextFallback(prompt, done));
    else copyTextFallback(prompt, done);
};

// ── Importar JSON ──
function openPasteJSON() {
    const html = `<div class="modal-overlay" onclick="if(event.target===this)window.closeModal()"><div class="modal-card">
      <div class="modal-header"><h3>Pegar lead(s) JSON</h3><button class="modal-close" onclick="window.closeModal()">✕</button></div>
      <div class="modal-body">
        <p style="color:var(--text-muted);font-size:.8125rem;margin-bottom:.5rem">Pegá un objeto o un array de objetos con los campos del lead. Se completan los faltantes. Si el JSON trae <b>id</b> o <b>lead_id</b> de un lead existente, ese lead se <b>actualiza</b> — ideal para pegar la respuesta del botón ✨ IA.</p>
        <textarea id="json-input" rows="10" style="width:100%" placeholder='{"razon_social":"Agrícola X","clasificacion":"Agrícola","tipo_cultivo":"Maíz","area_ha":120}'></textarea>
        <div id="json-error" class="alert alert-error" style="display:none;margin-top:.5rem"></div>
      </div>
      <div class="modal-footer"><button class="btn-ghost" onclick="window.closeModal()">Cancelar</button><button class="btn-primary" onclick="window.importJSON()">Importar</button></div>
    </div></div>`;
    document.getElementById('modal-root').innerHTML = html;
}
window.openPasteJSON = openPasteJSON;
window.importJSON = async () => {
    const raw = document.getElementById('json-input').value;
    try {
        const parsed = parseFlexibleJSON(raw);
        const arr = Array.isArray(parsed) ? parsed : [parsed];
        let n = 0;
        for (const obj of arr) {
            // upsert: si el JSON referencia un lead existente (id o lead_id),
            // se mezcla sobre sus datos actuales — así una respuesta parcial
            // de la IA nunca borra campos.
            const existing = state.leads.find(x => (obj.id && x.id === obj.id) || (obj.lead_id && x.lead_id === obj.lead_id));
            const lead = existing ? { ...existing, ...obj, id: existing.id, lead_id: existing.lead_id } : { ...emptyLead(), ...obj };
            if (!lead.modelo_recomendado) lead.modelo_recomendado = recomendarModelo(lead.area_ha);
            const ok = await saveLead(lead);
            if (ok) n++;
        }
        closeModal();
        showToast(`✓ ${n} lead(s) importado(s)/actualizado(s)`);
    } catch (err) {
        const e = document.getElementById('json-error');
        e.textContent = 'JSON inválido: ' + err.message; e.style.display = 'block';
    }
};

// ── Exportar CSV ──
function exportCSV() {
    const cols = ['lead_id', 'estado', 'clasificacion', 'tipo_cultivo', 'area_ha', 'fecha_aplicacion', 'modelo_recomendado', 'razon_social', 'contacto_principal', 'email', 'telefono', 'ciudad_pais', 'usd_estimado', 'moneda', 'probabilidad_pct', 'cotizacion_competencia', 'competencia_detalle', 'proxima_accion', 'fecha_proxima_accion', 'vendedor', 'lead_source', 'notas'];
    const esc = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const csv = [cols.join(','), ...state.leads.map(l => cols.map(c => esc(l[c])).join(','))].join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `nase_leads_${today()}.csv`;
    a.click();
    showToast('✓ CSV exportado');
}
window.exportCSV = exportCSV;

<div id="crm-gate">
  <div class="gate-card" id="gate-login">
