<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NASE Agrotech · CRM demo (datos de ejemplo, sin login)">
<meta name="robots" content="noindex,nofollow">
<title>NASE Agrotech · CRM — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="demo-badge" style="position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;align-items:center;gap:.5rem;background:rgba(8,8,12,.92);border:1px solid rgba(107,163,31,.5);border-radius:999px;padding:.45rem .8rem;font-family:'JetBrains Mono',monospace;font-size:11px;color:#aed581;box-shadow:0 6px 24px rgba(0,0,0,.5)">
    <span style="width:7px;height:7px;border-radius:50%;background:#8bc34a;box-shadow:0 0 8px #8bc34a"></span>
    <span>Modo demo · datos de ejemplo (no se guardan)</span>
</div>

<!-- ===== LOGIN (no se usa en demo, sesión falsa) ===== -->
<div id="login-view" class="login-container" style="display:none">
    <div class="login-card">
        <div class="brand" style="text-align:center">
            <img src="./assets/logo-nase.jpg" alt="NASE Agrotech" style="height:64px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:1rem">
            <h1 class="brand-title">CRM · Pipeline</h1><div class="brand-tagline">Demo</div>
        </div>
        <form id="login-form" class="login-form">
            <div class="field"><label>Email</label><input type="email" id="login-email"></div>
            <div class="field"><label>Password</label><input type="password" id="login-password"></div>
            <button type="submit" class="btn-primary" id="login-submit">Entrar</button>
            <div class="login-actions"><button type="button" class="btn-link" id="signup-toggle">Crear cuenta</button><button type="button" class="btn-link" id="forgot-password">Recuperar</button></div>
            <div id="login-error" class="alert alert-error" style="display:none"></div>
            <div id="login-success" class="alert alert-success" style="display:none"></div>
        </form>
    </div>
</div>

<div id="app-view" style="display:none">
    <header class="app-header">
        <div class="header-content">
            <div class="header-left">
                <div class="brand-mini" style="display:flex;align-items:center;gap:.6rem">
                    <img src="./assets/logo-nase.jpg" alt="NASE" style="height:34px;background:#fff;border-radius:7px;padding:3px 6px">
                    <div><div class="brand-mini-eyebrow">NASE Agrotech</div><div class="brand-mini-title">CRM · Pipeline</div></div>
                </div>
                <nav class="nav-tabs">
                    <button class="nav-tab active" data-view="dashboard"><span>Dashboard</span></button>
                    <button class="nav-tab" data-view="kanban"><span>Pipeline</span></button>
                    <button class="nav-tab" data-view="agenda"><span>Agenda</span><span id="badge-agenda" class="badge" style="display:none">0</span></button>
                    <button class="nav-tab" data-view="auditoria"><span>Auditoría</span></button>
                </nav>
            </div>
            <div class="header-right">
                <div class="user-info">👤 <span id="user-email"></span></div>
                <button class="btn-secondary" id="btn-export"><span>Exportar CSV</span></button>
                <button class="btn-secondary cyan" id="btn-paste-json"><span>JSON</span></button>
                <button class="btn-primary" id="btn-new-lead"><span>+ Nuevo</span></button>
                <button class="btn-ghost" id="btn-logout" title="Recargar demo">⎋</button>
            </div>
        </div>
    </header>
    <main id="view-dashboard" class="view active">
        <div class="container">
            <div class="kpi-grid" id="kpi-grid"></div>
            <div class="filters-bar">
                <div class="search-wrap"><input type="text" id="search-input" placeholder="Buscar empresa, contacto, cultivo, vendedor…"></div>
                <select id="filter-estado"><option value="all">Todos los estados</option></select>
                <select id="filter-clasificacion"><option value="all">Toda clasificación</option></select>
                <select id="filter-cultivo"><option value="all">Todo cultivo</option></select>
                <select id="filter-vendedor"><option value="all">Todos los vendedores</option></select>
                <div class="leads-count" id="leads-count"></div>
            </div>
            <div class="table-wrap"><div class="table-header"><h3>Leads priorizados</h3><span class="table-subtitle">★ Top 5 por valor ponderado</span></div><div id="leads-table"></div></div>
        </div>
    </main>
    <main id="view-kanban" class="view" style="display:none"><div class="container container-wide"><div class="kanban-board" id="kanban-board"></div></div></main>
    <main id="view-agenda" class="view" style="display:none"></main>
    <main id="view-auditoria" class="view" style="display:none"></main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" style="display:none"></div>
<div id="loading" class="loading-overlay" style="display:none"><div class="spinner"></div></div>

<!-- ===== SCRIPTS (modo demo) ===== -->
<script src="./demo.data.js"></script>
<script src="./core/constants.js"></script>
<script src="./core/auth.js"></script>
<script src="./core/events.js"></script>
<script src="./modules/crm/crm.js"></script>
<script src="./main.js"></script>
</body>
</html>
